name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 直接用官方 kivy/buildozer Docker 镜像（ghcr.io/kivy/buildozer:latest，
    # 即 buildozer 官方 CI 用的环境）。它自带与 libffi 兼容的工具链、预装
    # Android SDK/NDK/JDK，从根上绕开 Ubuntu 24.04 系统 libtool 2.4.7 删除
    # LT_SYS_SYMBOL_USCORE 宏导致 libffi 编译失败的坑。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 确认 docker 可用
        run: |
          docker --version || echo ">>> DOCKER 不可用"
          docker info >/dev/null 2>&1 && echo ">>> docker daemon OK" || echo ">>> docker daemon 起不来"

      - name: 预置 Android SDK 许可证（绕过交互式 Accept 提示）
        run: |
          # buildozer 在官方镜像里不会自动接受许可证（会弹 Accept? (y/N) 并默认跳过），
          # 导致 build-tools 装不上。这里直接把"已接受"的许可证哈希文件准备好，
          # 构建时挂载进容器 SDK 的 licenses 目录，sdkmanager 看到即不再提示。
          mkdir -p licenses
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > licenses/android-sdk-license
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > licenses/android-sdk-preview-license
          echo ">>> 已生成许可证文件："
          ls -la licenses/

      - name: 用官方 Buildozer 镜像构建 APK
        run: |
          # 关键：捕获管道中任意命令（含 docker）的失败，否则 tee 会掩盖退出码误报成功
          set -o pipefail
          # 让挂载进容器的目录可被镜像内默认用户写入，避免权限报错
          chmod -R a+rwX .
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$PWD/licenses":/home/user/.buildozer/android/platform/android-sdk/licenses \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug 2>&1 | tee build_output.txt

      - name: 上传 APK 供下载
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/

      # 无论成败都留一份完整日志（含 docker / buildozer 全部输出），方便定位
      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            .buildozer/
            bin/
