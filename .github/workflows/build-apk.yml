name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 用官方 Buildozer Docker 镜像（ghcr.io/kivy/buildozer），
    # 镜像里自带与 libffi 兼容的 libtool / autoconf / automake 工具链，
    # 从根本上绕开 Ubuntu 24.04 自带 libtool 2.4.7 与新版 libffi configure.ac
    # 不兼容（possibly undefined macro: LT_SYS_SYMBOL_USCORE）的坑
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 用 Buildozer 构建 APK
        # 官方维护的 action，内部使用 kivy/buildozer Docker 镜像，
        # 已成功用于 KivyMD 等大量项目；buildozer.spec 在仓库根目录，workdir 用 .
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: 上传 APK 供下载
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: ${{ steps.buildozer.outputs.filename }}

      # 失败兜底：把 .buildozer 构建缓存（含日志）传上来，方便继续定位
      - name: 上传失败日志
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .buildozer/
