name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 直接用官方 kivy/buildozer Docker 镜像（ghcr.io/kivy/buildozer:latest，
    # 即 buildozer 官方 CI 用的环境）。它自带与 libffi 兼容的工具链、预装
    # Android SDK/NDK/JDK，从根上绕开 Ubuntu 24.04 系统 libtool 2.4.7 删除
    # LT_SYS_SYMBOL_USCORE 宏导致 libffi 编译失败的坑。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 确认 docker 可用
        run: |
          docker --version || echo ">>> DOCKER 不可用"
          docker info >/dev/null 2>&1 && echo ">>> docker daemon OK" || echo ">>> docker daemon 起不来"

      - name: 用官方 Buildozer 镜像构建 APK
        run: |
          # 关键：捕获管道中任意命令（含 docker）的失败，否则 tee 会掩盖退出码误报成功
          set -o pipefail
          # 让挂载进容器的目录可被镜像内默认用户写入，避免权限报错
          chmod -R a+rwX .
          # 不能用「挂载 licenses 目录」的方式预置许可证——那会顺带在容器内预建空的
          # android-sdk 目录，导致 buildozer 误判 SDK 已存在、跳过下载 cmdline-tools(sdkmanager)。
          # 正确做法：先让 buildozer 下载好整套 SDK/NDK/cmdline-tools（第一次会因许可证交互提示失败，
          # 但 sdkmanager 已就位），再用 sdkmanager --licenses 真正接受，最后第二次完整编译打包。
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint bash \
            ghcr.io/kivy/buildozer:latest \
            -c "
              set -o pipefail
              cd /home/user/hostcwd
              echo '>>> 第 1 次：下载 SDK/NDK/cmdline-tools（许可证提示会使其失败，属预期）'
              buildozer android debug 2>&1 | tee /tmp/build1.log || true
              SDK=/home/user/.buildozer/android/platform/android-sdk
              if [ -x \"\$SDK/cmdline-tools/latest/bin/sdkmanager\" ]; then
                echo '>>> 自动接受所有 SDK 许可证'
                yes | \"\$SDK/cmdline-tools/latest/bin/sdkmanager\" --licenses || true
              else
                echo '>>> 警告：未找到 sdkmanager，可能 SDK 未下载'
              fi
              echo '>>> 第 2 次：许可证已接受，完整编译并打包 APK'
              buildozer android debug 2>&1 | tee build_output.txt
            "

      - name: 上传 APK 供下载
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/

      # 无论成败都留一份完整日志（含 docker / buildozer 全部输出），方便定位
      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            .buildozer/
            bin/
