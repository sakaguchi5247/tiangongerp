name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 用最新款 Ubuntu（固定写 22.04 会因 GitHub 退役旧镜像而失败）
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # autoconf/automake/libtool 是编译 Python 必需的，机器只自带 autoconf，
      # 其余开发库一并补齐；整行带兜底，装不上也不中断
      - name: 补装编译用的开发库
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool \
            zlib1g-dev libbz2-dev liblzma-dev libffi-dev libssl-dev || true

      - name: 缓存 Buildozer 下载内容（改了 buildozer.spec 才需要重新冷构建）
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: 安装 Buildozer
        run: pip install buildozer cython==0.29.37

      - name: 构建 APK
        # yes 用来自动应答安卓 SDK 的协议询问，否则云端无人会卡住
        run: yes | buildozer -v android debug

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/*.apk
