name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 直接用官方 kivy/buildozer Docker 镜像（ghcr.io/kivy/buildozer:latest，
    # 即 buildozer 官方 CI 用的环境）。它自带与 libffi 兼容的工具链、预装
    # Android SDK/NDK/JDK，从根上绕开 Ubuntu 24.04 系统 libtool 2.4.7 删除
    # LT_SYS_SYMBOL_USCORE 宏导致 libffi 编译失败的坑。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 确认 docker 可用
        run: |
          docker --version || echo ">>> DOCKER 不可用"
          docker info >/dev/null 2>&1 && echo ">>> docker daemon OK" || echo ">>> docker daemon 起不来"

      - name: 切换到 p4a develop 分支（本轮关键修复）
        run: |
          # ================= 根因说明 =================
          # 上一版（第十六、十七版）已经把 Python/Android 原生库全部交叉编译成功
          # （hostpython3 / openssl / sqlite3 / python3 / pyjnius / _android*.so 均已
          #   生成并 strip），唯独卡在最后一步：
          #     [INFO]: PYTHON PACKAGE / PROJECT INSTALL STAGE
          #     -> python -m venv venv
          #     -> source venv/bin/activate && pip install -U pip
          #     ImportError: cannot import name 'BuildDependencyInstallError'
          # 追到 p4a 源码，真凶是「master 分支」独有的两处：
          #   1) pythonforandroid/recipes/pyjnius/__init__.py
          #        master : depends = [('genericndkbuild','sdl2','sdl3'), 'six']
          #        develop: depends = [('genericndkbuild','sdl2','sdl3')]   <- six 已被删除
          #     而 p4a 历代版本都没有 six 配方，于是 six 只能回退用 pip 安装；
          #   2) pythonforandroid/build.py:876-878
          #        master : info('Upgrade pip to latest version')
          #                 sh.bash('-c', "source venv/bin/activate && pip install -U pip")
          #        develop: 该段已被整体删除，改用 pip install --target <site-packages> 直装。
          # 两者叠加 = six 触发 pip 安装 -> 临时 venv 自升级把 pip 弄坏 -> 构建崩溃。
          # 而 p4a 的 develop 分支同时修好了这两点，且 python3 配方版本同为 3.14.2，
          # 故直接切 develop，从根上绕开，不需要再提供 six 本地配方。
          # ============================================
          python3 - <<'PYEOF'
          import io

          path = 'buildozer.spec'
          text = io.open(path, encoding='utf-8').read()
          lines = text.split('\n')
          stripped = [l.strip() for l in lines]

          # 定位 [app] 段：从 [app] 行起，到下一个顶层段落头之前
          start = stripped.index('[app]')
          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].lstrip().startswith('['):
                  end = i
                  break

          seg = lines[start:end]
          # 清掉旧值，保证幂等
          seg = [l for l in seg if not l.lstrip().startswith('p4a.branch')]

          # 插到 [app] 段最后一个非空行之后
          last = len(seg) - 1
          while last > 0 and seg[last].strip() == '':
              last -= 1
          seg[last + 1:last + 1] = ['', 'p4a.branch = develop']
          lines[start:end] = seg

          io.open(path, 'w', encoding='utf-8').write('\n'.join(lines))

          # ------- 自检：必须真的落在 [app] 段内，否则立刻失败，不浪费 15 分钟 -------
          # （第十七版就是踩了这个坑：把配置追加到 spec 文件末尾，落进 [buildozer] 段被忽略）
          lines = io.open(path, encoding='utf-8').read().split('\n')
          s = [l.strip() for l in lines].index('[app]')
          e = len(lines)
          for i in range(s + 1, len(lines)):
              if lines[i].lstrip().startswith('['):
                  e = i
                  break
          hit = [l for l in lines[s:e] if l.lstrip().startswith('p4a.branch')]
          print('>>> [app] 段内的 p4a.branch 行：', hit)
          assert len(hit) == 1 and 'develop' in hit[0], '!!! p4a.branch 未正确写入 [app] 段'
          print('>>> 自检通过：p4a 将使用 develop 分支')
          PYEOF
          echo "===== 最终生效的关键配置 ====="
          grep -n "p4a.branch\|p4a.port\|requirements\|p4a.bootstrap" buildozer.spec || true

      - name: 用官方 Buildozer 镜像构建 APK
        run: |
          set -o pipefail
          chmod -R a+rwX .
          # 两个关键点，缺一不可：
          # 1) 必须用镜像的默认 entrypoint。它会把容器内用户切成宿主 UID；
          #    若手动指定 --entrypoint bash，容器会以 root 运行，buildozer 会弹
          #    "Are you sure you want to continue [y/n]?"，CI 非交互环境 stdin 为 EOF
          #    → 立刻 EOFError 崩溃（第 15 版即死于此，35 秒挂）。
          # 2) 加 -i 附加标准输入，并用 yes 管道。SDK 许可证安装 build-tools 时会询问
          #    Accept? (y/N)，非交互下默认跳过 → build-tools 装不上 → Aidl not found。
          #    yes 会自动回答 y，许可证得以接受。
          yes | docker run --rm -i \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug 2>&1 | tee build_output.txt

      - name: 失败时直接把关键报错打到页面上
        if: failure()
        run: |
          echo "===== 构建日志最后 60 行 ====="
          tail -n 60 build_output.txt || true
          echo "===== 失败命令定位（含上下文）====="
          grep -n "BUILD FAILED\|Command failed\|Error code\|ERROR:" build_output.txt | tail -n 20 || true
          echo "===== 是否还在走 venv/pip 自升级（应为空）====="
          grep -n "Upgrade pip to latest\|source venv/bin/activate" build_output.txt || echo ">>> 好：没有再走 venv/pip 自升级"

      - name: 上传 APK 供下载
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/

      # 无论成败都留一份完整日志（含 docker / buildozer 全部输出），方便定位
      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            .buildozer/
            bin/
