name: 构建安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    # 用最新款 Ubuntu（固定写 22.04 会因 GitHub 退役旧镜像而失败）
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo-dev \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: 缓存 Buildozer 下载内容
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: 安装 Buildozer
        run: pip install buildozer cython==0.29.37

      - name: 构建 APK
        run: buildozer -v android debug

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/*.apk
