name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 用最新款 Ubuntu（固定写 22.04 会因 GitHub 退役旧镜像而失败）
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # autotools 全家桶：编译 libffi / Python 需要；libtool-bin 提供 libtoolize，
      # gettext 提供 autopoint，缺了会出现 "possibly undefined macro" 类报错
      - name: 补装编译用的开发库
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin gettext autoconf-archive m4 \
            zlib1g-dev libbz2-dev liblzma-dev libffi-dev libssl-dev || true

      - name: 构建前环境自检
        run: |
          aclocal --version | head -1
          autoconf --version | head -1
          automake --version | head -1
          libtoolize --version | head -1
          ls -la /usr/share/aclocal/libtool.m4

      - name: 安装 Buildozer
        run: pip install buildozer cython==0.29.37

      # ACLOCAL_PATH 指向系统宏目录，确保 libtool.m4 等宏一定被 aclocal 索引到
      # 全程输出存档到 build_output.txt；pipefail 保证失败如实上报
      - name: 构建 APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build_output.txt

      # 失败时把真正的报错自动提到日志末尾，不用再人工翻几千行
      - name: 失败时自动提取关键报错
        if: failure()
        run: |
          echo "========== 1. 失败的那条命令（Command failed）及其前 20 行 =========="
          grep -n -B20 -A3 "Command failed" build_output.txt || echo "(未找到)"
          echo ""
          echo "========== 2. 所有 error / fatal / Traceback 行 =========="
          grep -n -i -E "error:|fatal:|exception|traceback|FAILURE" build_output.txt | head -50 || echo "(未找到)"
          echo ""
          echo "========== 3. 日志最后 60 行 =========="
          tail -60 build_output.txt

      - name: 上传完整构建日志存档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt

      - name: 上传 APK 供下载
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/*.apk
