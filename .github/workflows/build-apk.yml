name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 直接用官方 kivy/buildozer Docker 镜像（ghcr.io/kivy/buildozer:latest，
    # 即 buildozer 官方 CI 用的环境）。它自带与 libffi 兼容的工具链、预装
    # Android SDK/NDK/JDK，从根上绕开 Ubuntu 24.04 系统 libtool 2.4.7 删除
    # LT_SYS_SYMBOL_USCORE 宏导致 libffi 编译失败的坑。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 确认 docker 可用
        run: |
          docker --version || echo ">>> DOCKER 不可用"
          docker info >/dev/null 2>&1 && echo ">>> docker daemon OK" || echo ">>> docker daemon 起不来"

      - name: 安装 Pillow（合成高清图标用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil

      - name: 写入高清应用图标
        run: |
          # 只内嵌一张透明背景的宫殿前景；纯黑背景与 512x512 回退图标在 CI 内合成。
          # 原因：原先只有一个 128x128 的图标，装到高分屏手机上会被系统放大而发虚。
          python3 - <<'PYEOF'
          import base64, io, os
          from PIL import Image

          FG_B64 = ""
          raw = Image.open(io.BytesIO(base64.b64decode(''.join(FG_B64.split())))).convert('RGBA')

          d = 'app/erp/ui/assets'
          os.makedirs(d, exist_ok=True)

          # 宫殿统一刷成「天宫红」RGB(171,7,12)，与原 128x128 图标保持一致。
          # AI 生成的源图偏亮偏橙，这里统一刷色，顺便抹掉抗锯齿杂色。
          RED = (171, 7, 12)
          alpha = raw.getchannel('A')
          palace = Image.new('RGBA', raw.size, RED + (255,))
          palace.putalpha(alpha)
          palace = palace.crop(alpha.getbbox())     # 裁掉四周空白，便于精确控制占比

          def build(canvas, ratio, bg, opaque):
              c = Image.new('RGBA', (canvas, canvas), bg + ((255,) if opaque else (0,)))
              w, h = palace.size
              sc = (canvas * ratio) / max(w, h)      # 等比缩放，宫殿绝不变形
              p = palace.resize((max(1, int(w * sc)), max(1, int(h * sc))), Image.LANCZOS)
              c.alpha_composite(p, ((canvas - p.size[0]) // 2, (canvas - p.size[1]) // 2))
              return c

          # 自适应图标前景：内容占画布 50%。
          # 这样最远的屋檐角（对角半径约 127px）也落在 66dp 安全圆
          # （半径 132px）以内，圆形/圆角方形/水滴等任何遮罩都切不到。
          build(432, 0.50, (0, 0, 0), False).save(
              os.path.join(d, 'icon_fg.png'), optimize=True)

          # 自适应图标背景：纯黑，与原图标底色一致
          Image.new('RGBA', (432, 432), (0, 0, 0, 255)).save(
              os.path.join(d, 'icon_bg.png'), optimize=True)

          # Android 7 及以下回退用的完整图标：黑底 + 宫殿占 68%
          build(512, 0.68, (0, 0, 0), True).convert('RGB').save(
              os.path.join(d, 'icon.png'), optimize=True)

          for f in ('icon_fg.png', 'icon_bg.png', 'icon.png'):
              pth = os.path.join(d, f)
              im = Image.open(pth)
              print('>>> %-12s %dx%d  %6d bytes' % (f, im.size[0], im.size[1], os.path.getsize(pth)))

          PYEOF
      - name: 应用名改为「天宫ERP」并切到 p4a develop 分支
        run: |
          # ================= 两个改动 =================
          # A) title：把桌面图标下方显示的名字从「天宫ERP系统」改成「天宫ERP」
          # B) p4a.branch：这是第十七/十八版的关键修复。
          #    buildozer 默认拉 p4a 的 master 分支（见 buildozer/targets/android.py:
          #    p4a_branch = 'master'），而 master 的 recipes/pyjnius 写着
          #      depends = [('genericndkbuild','sdl2','sdl3'), 'six']
          #    但 p4a 历代版本都没有 six 配方（master/develop/2024.01.21/2019.10.06
          #    均无），于是 six 回退用 pip 安装；master 的 build.py 在此会
          #    `python -m venv venv` + `pip install -U pip`，把临时 venv 的 pip
          #    升级坏掉，抛 ImportError: cannot import name
          #    'BuildDependencyInstallError'，构建在最后一步崩溃。
          #    develop 分支已：① 删除 pyjnius 对 six 的依赖；② 删掉该 venv/pip
          #    自升级逻辑，改用 pip install --target 直装。故切 develop 彻底绕开。
          # ============================================
          python3 - <<'PYEOF'
          import io

          path = 'buildozer.spec'
          lines = io.open(path, encoding='utf-8').read().split('\n')
          st = [l.strip() for l in lines]
          start = st.index('[app]')
          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].lstrip().startswith('['):
                  end = i
                  break

          seg = lines[start:end]

          # A) 改 title
          for i, l in enumerate(seg):
              if l.lstrip().startswith('title'):
                  seg[i] = 'title = 天宫ERP'

          # B) 清掉旧值，保证幂等
          prefixes = ('icon.adaptive_foreground.filename',
                      'icon.adaptive_background.filename',
                      'p4a.branch')
          seg = [l for l in seg if not l.lstrip().startswith(prefixes)]

          # 插到 [app] 段最后一个非空行之后
          last = len(seg) - 1
          while last > 0 and seg[last].strip() == '':
              last -= 1
          seg[last + 1:last + 1] = [
              '',
              '# 自适应图标（Android 8.0+ 生效）：透明前景 + 纯黑背景',
              'icon.adaptive_foreground.filename = %(source.dir)s/erp/ui/assets/icon_fg.png',
              'icon.adaptive_background.filename = %(source.dir)s/erp/ui/assets/icon_bg.png',
              '',
              'p4a.branch = develop',
          ]
          lines[start:end] = seg
          io.open(path, 'w', encoding='utf-8').write('\n'.join(lines))

          # ------- 自检：新配置必须真的落在 [app] 段内，否则立刻失败 -------
          # （第十七版就栽在这：把配置追加到 spec 文件末尾，落进 [buildozer] 段被忽略）
          lines = io.open(path, encoding='utf-8').read().split('\n')
          s = [l.strip() for l in lines].index('[app]')
          e = len(lines)
          for i in range(s + 1, len(lines)):
              if lines[i].lstrip().startswith('['):
                  e = i
                  break
          appseg = lines[s:e]
          for key in ('title = 天宫ERP', 'p4a.branch = develop',
                      'icon.adaptive_foreground.filename',
                      'icon.adaptive_background.filename'):
              hit = [l for l in appseg if l.strip().startswith(key)]
              assert len(hit) == 1, '!!! %s 未正确写入 [app] 段 (命中 %d 条)' % (key, len(hit))
              print('>>> OK [app]:', hit[0].strip())
          PYEOF
      - name: 用载荷覆盖 app 目录
        run: |
          # 仓库根目录的 app_src.b64 是「桌面端交付包同步结果」的压缩包。
          # 有它就用它覆盖 app/，保证 APK 里打的永远是最新的代码；
          # 没有它就沿用仓库里的 app/ —— 这一步永远是可选的，绝不让构建失败。
          if [ ! -f app_src.b64 ]; then
            echo ">>> 仓库里没有 app_src.b64，沿用仓库自带的 app/ 目录"
            exit 0
          fi
          python3 - <<'PYEOF'
          import base64, hashlib, io, lzma, os, shutil, tarfile

          b64 = open('app_src.b64', encoding='ascii').read()
          comp = base64.b64decode(''.join(b64.split()))
          sha = hashlib.sha256(comp).hexdigest()
          print('>>> 载荷 sha256 =', sha)

          if os.path.isfile('app_src.sha256'):
              want = open('app_src.sha256').read().strip()
              if want and want != sha:
                  raise SystemExit('!!! 载荷校验失败：期望 %s，实际 %s' % (want, sha))
              print('>>> 校验通过')

          raw = lzma.decompress(comp)
          tmp = 'app_payload_tmp'
          shutil.rmtree(tmp, ignore_errors=True)
          os.makedirs(tmp)
          with tarfile.open(fileobj=io.BytesIO(raw)) as tf:
              tf.extractall(tmp)

          src = os.path.join(tmp, 'app')
          if not os.path.isdir(src):
              raise SystemExit('!!! 载荷里没有 app/ 目录')

          # 先改名再拷贝：拷贝失败还能把原来的 app/ 换回来，不会把构建现场搞坏
          if os.path.isdir('app'):
              shutil.move('app', 'app_prev')
          try:
              shutil.copytree(src, 'app')
          except Exception:
              if os.path.isdir('app'):
                  shutil.rmtree('app')
              if os.path.isdir('app_prev'):
                  shutil.move('app_prev', 'app')
              raise
          shutil.rmtree('app_prev', ignore_errors=True)
          shutil.rmtree(tmp, ignore_errors=True)

          n = sum(len(f) for _, _, f in os.walk('app'))
          print('>>> 已用载荷覆盖 app/，共 %d 个文件' % n)
          PYEOF
      - name: 用官方 Buildozer 镜像构建 APK
        run: |
          # 注意：这里千万别开「管道中任一命令失败即整条失败」的 shell 选项。
          # 第十八版就是这个坑：docker 已经正常跑完并退出（APK 打包成功，
          # 日志末尾是 BUILD SUCCESSFUL / Android packaging done），但 `yes`
          # 还在往已关闭的管道写，被 SIGPIPE 杀掉、退出码 141；上述选项会把
          # 这个 141 当作整条命令失败 → 本步骤判红 → 上传 APK 那步被跳过，
          # 白白误判成"构建失败"。改成只取 docker 自己的退出码。
          chmod -R a+rwX .
          # 两个关键点，缺一不可：
          # 1) 必须用镜像的默认 entrypoint。它会把容器内用户切成宿主 UID；
          #    若手动指定 --entrypoint bash，容器会以 root 运行，buildozer 会弹
          #    "Are you sure you want to continue [y/n]?"，CI 非交互环境 stdin 为 EOF
          #    → 立刻 EOFError 崩溃（第 15 版即死于此，35 秒挂）。
          # 2) 加 -i 附加标准输入，并用 yes 管道。SDK 许可证安装 build-tools 时会询问
          #    Accept? (y/N)，非交互下默认跳过 → build-tools 装不上 → Aidl not found。
          #    yes 会自动回答 y，许可证得以接受。
          # 日志写进文件再 cat，不用 tee 管道：
          # docker 是管道里最后一个命令，$? 拿到的就是 docker 自己的退出码，
          # 不受上游 yes 被 SIGPIPE 干掉（退出码 141）的干扰。
          # 注意：本文件里禁止出现「美元符号紧跟左花括号」的写法。GitHub 会扫描
          # 工作流里所有此类片段并当作表达式求值，一旦遇到不存在的名字
          # （例如 shell 的数组变量）整个文件直接作废，连一个作业都起不来。
          yes | docker run --rm -i \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug > build_output.txt 2>&1
          RC=$?
          cat build_output.txt
          echo "===== docker 真实退出码 = $RC ====="
          exit $RC

      - name: 用固定密钥重签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 为什么必须用固定密钥：
          # buildozer 的 debug 构建每次都临时生成一把 debug 密钥，密钥一变，
          # APK 签名就变，新包装不上（提示"应用未安装"），只能先卸载旧版 ——
          # 而卸载会连带删掉 App 数据目录，也就是手机上录的每一张单据。
          # 所以用一把自己掌握、跨构建固定的密钥，新包就能直接覆盖安装。
          if [ -z "$KEYSTORE_B64" ]; then
            echo ">>> 未配置 ANDROID_KEYSTORE_B64，沿用 buildozer 的 debug 签名"
            echo ">>> !! 提醒：debug 签名每次构建都不同，新包无法覆盖安装（需先卸载，手机数据会丢）"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\n' | base64 -d > tiangong.keystore
          if [ ! -s tiangong.keystore ]; then
            echo ">>> !! 密钥解码失败，跳过重签名"
            exit 0
          fi
          chmod 600 tiangong.keystore

          # apksigner 只存在于构建镜像里，宿主机没有，所以这一步也得进容器。
          # 任何一步失败都只是跳过重签名，绝不把整个构建判红。
          docker run --rm \
            -e KEY_ALIAS \
            -e KEY_PASSWORD \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint bash \
            ghcr.io/kivy/buildozer:latest \
            -c '
              set -e
              SIGNER=""
              for p in /opt/android-sdk/build-tools/*/apksigner \
                       /home/user/.buildozer/android/platform/build-tools/*/apksigner \
                       /root/.buildozer/android/platform/build-tools/*/apksigner \
                       $ANDROID_HOME/build-tools/*/apksigner ; do
                if [ -x "$p" ]; then SIGNER="$p"; break; fi
              done
              if [ -z "$SIGNER" ]; then
                echo "!!! 容器里找不到 apksigner，跳过重签名"
                exit 3
              fi
              echo ">>> 使用签名工具: $SIGNER"
              APK=$(ls bin/*.apk 2>/dev/null | head -1)
              if [ -z "$APK" ]; then
                echo "!!! bin/ 里没有 APK，跳过重签名"
                exit 4
              fi
              echo ">>> 待签名: $APK"
              "$SIGNER" sign \
                --ks tiangong.keystore \
                --ks-type PKCS12 \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEY_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "$APK.signed" "$APK"
              mv "$APK.signed" "$APK"
              echo ">>> 签名信息："
              "$SIGNER" verify --print-certs "$APK" | head -6
              echo ">>> 重签名完成"
            ' || echo ">>> !! 重签名未完成，APK 仍是 debug 签名（可安装，但下次需先卸载）"
          rm -f tiangong.keystore

          # 统一命名：带上版本号与架构，一眼看出装的是哪个
          for f in bin/*.apk; do
            [ -f "$f" ] || continue
            NEW="bin/tiangongerp-$(grep -m1 "^version" buildozer.spec | cut -d= -f2 | tr -d " ")-arm64-v8a.apk"
            mv "$f" "$NEW"
            echo ">>> 已重命名: $NEW"
          done

      - name: 失败时直接把关键报错打到页面上
        if: failure()
        run: |
          echo "===== 构建日志最后 60 行 ====="
          tail -n 60 build_output.txt || true
          echo "===== 失败命令定位（含上下文）====="
          grep -n "BUILD FAILED\|Command failed\|Error code\|ERROR:" build_output.txt | tail -n 20 || true

      # 改成 always：只要 bin/ 里出现了 APK 就一定上传，不再被上一步的判定牵连
      # （第十八版 APK 其实打包成功，却因为 yes 的 SIGPIPE 141 被误判失败、这里被跳过）
      - name: 上传 APK 供下载
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/*.apk

      # 无论成败都留一份完整日志（含 docker / buildozer 全部输出），方便定位
      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            .buildozer/
            bin/
