name: 构建安卓 APK

on:
  # 网页上手动点按钮也能触发
  workflow_dispatch:
  # 往任意分支上传文件都自动构建，不用管分支叫 main 还是 master
  push:
    branches: [ "**" ]

# 同时只跑一个，新任务来了就取消旧的，省得白等
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 直接用官方 kivy/buildozer Docker 镜像（ghcr.io/kivy/buildozer:latest，
    # 即 buildozer 官方 CI 用的环境）。它自带与 libffi 兼容的工具链、预装
    # Android SDK/NDK/JDK，从根上绕开 Ubuntu 24.04 系统 libtool 2.4.7 删除
    # LT_SYS_SYMBOL_USCORE 宏导致 libffi 编译失败的坑。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 确认 docker 可用
        run: |
          docker --version || echo ">>> DOCKER 不可用"
          docker info >/dev/null 2>&1 && echo ">>> docker daemon OK" || echo ">>> docker daemon 起不来"

      - name: 补齐 six 本地配方（绕开有问题的 pip 步骤）
        run: |
          # 背景：第十六版已经把 Python/Android 原生库全部交叉编译完成，只差最后一步——
          # p4a 依赖图里带了 six，但 master 版没有 six 配方，于是回退用 pip 安装；
          # 而 p4a 为此新建的 venv 里 pip 自升级会把自身搞坏
          # （ImportError: cannot import name 'BuildDependencyInstallError'）。
          # 解法：提供一个 six 本地配方，让 p4a 走源码安装，彻底不碰 pip 那一步。
          mkdir -p recipes/six
          cat > recipes/six/__init__.py <<'PYEOF'
          from pythonforandroid.recipe import PythonRecipe


          class SixRecipe(PythonRecipe):
              version = '1.16.0'
              url = 'https://files.pythonhosted.org/packages/source/s/six/six-{version}.tar.gz'
              depends = []
              call_hostpython_via_targetpython = False


          recipe = SixRecipe()
          PYEOF
          echo ">>> 已生成 six 本地配方："
          cat recipes/six/__init__.py
          printf '\np4a.local_recipes = recipes\n' >> buildozer.spec
          echo ">>> 已追加 local_recipes 配置："
          grep -n "p4a.local_recipes" buildozer.spec || true

      - name: 用官方 Buildozer 镜像构建 APK
        run: |
          set -o pipefail
          chmod -R a+rwX .
          # 两个关键点，缺一不可：
          # 1) 必须用镜像的默认 entrypoint。它会把容器内用户切成宿主 UID；
          #    若手动指定 --entrypoint bash，容器会以 root 运行，buildozer 会弹
          #    "Are you sure you want to continue [y/n]?"，CI 非交互环境 stdin 为 EOF
          #    → 立刻 EOFError 崩溃（第 15 版即死于此，35 秒挂）。
          # 2) 加 -i 附加标准输入，并用 yes 管道。SDK 许可证安装 build-tools 时会询问
          #    Accept? (y/N)，非交互下默认跳过 → build-tools 装不上 → Aidl not found。
          #    yes 会自动回答 y，许可证得以接受。
          yes | docker run --rm -i \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug 2>&1 | tee build_output.txt

      - name: 上传 APK 供下载
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tiangongerp-apk
          path: bin/

      # 无论成败都留一份完整日志（含 docker / buildozer 全部输出），方便定位
      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.txt
            .buildozer/
            bin/
